[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-translator"
version = "1.0.0"
description = "Real-time speech-to-text translation with AI-powered features"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Live Translator Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["translation", "speech-to-text", "whisper", "ollama", "gtk"]
dependencies = [
    "faster-whisper>=0.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "ollama>=0.1.0",
    "PyGObject>=3.42.0",
]

[project.optional-dependencies]
diarization = ["resemblyzer>=0.1.1"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
all = [
    "resemblyzer>=0.1.1",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]

[project.scripts]
live-translator = "live_translator.app:main"
live-translator-log-summary = "live_translator.tools.log_analyzer_cli:main"

[project.urls]
Homepage = "https://github.com/live-translator/live-translator"
Repository = "https://github.com/live-translator/live-translator"
Issues = "https://github.com/live-translator/live-translator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]
